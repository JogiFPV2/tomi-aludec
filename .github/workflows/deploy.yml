# Po każdym wypchnięciu na gałąź main: testy, budowa gry i zapis gotowych plików na gałąź „hostinger”.
# Hostinger (hPanel → Zaawansowane → GIT) pobiera gałąź „hostinger” do public_html.
name: Buduj i przygotuj do wdrożenia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Zapisz zbudowaną grę na gałęzi hostinger
        run: |
          cd dist
          touch .nojekyll
          git init -q -b hostinger
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Wdrożenie ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
